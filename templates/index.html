<!DOCTYPE html>
<html>
<head>
    <title>College Assistant Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="header">
    <h1>🎓 College Assistant Chatbot</h1>

    <button class="clear-btn" onclick="clearChat()">
        Clear Chat
    </button>
</div>

        <div id="chatbox">

            <div class="message bot">
                Hello! 👋

You can ask me about:

• Exams
• Admissions
• Fees
• Library
• Placements
• Hostel
• WiFi
• Scholarships
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Ask a question..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
